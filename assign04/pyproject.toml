[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "utxo"
version = "1.0.0"
description = "Assignment 4: A UTXO Ledger and Transaction Validator (IIT Patna CSE)"
authors = [{ name = "2301AI14" }]
requires-python = ">=3.11"
dependencies = [
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
utxo = "utxo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

